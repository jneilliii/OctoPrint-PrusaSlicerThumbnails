[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "Slicer-Thumbnails"
version = "1.2.3"
description = "Plugin that extracts thumbnails from uploaded gcode files sliced by PrusaSlicer."
authors = [
    { name = "jneilliii", email = "jneilliii+github@gmail.com" },
]
requires-python = ">=3.7,<4"
dependencies = [
    "Pillow>=9.5.0,<12.1.0",
    "standard-imghdr; python_version >= '3.13'",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
prusaslicerthumbnails = "octoprint_prusaslicerthumbnails"

[project.urls]
Homepage = "https://github.com/jneilliii/OctoPrint-PrusaSlicerThumbnails"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_prusaslicerthumbnails",
    "octoprint_prusaslicerthumbnails.*",
]
